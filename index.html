<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAZY PICK · 쉬고싶은청년</title>
<meta name="theme-color" content="#FFF4EC">
<meta name="description" content="최고의 가성비 제품을 공유드립니다. 이 페이지의 링크는 제휴 링크입니다.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#FFF8F2;--surface:#fff;--ink:#1B1626;--sub:#6F6877;--line:#EFE4DB;--accent:#5B3FD1;--accent-soft:#EEE9FF;--hot:#FF5A3C;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased;padding:0 max(18px,env(safe-area-inset-right,0px)) max(48px,calc(24px + env(safe-area-inset-bottom,0px))) max(18px,env(safe-area-inset-left,0px))}
.wrap{max-width:520px;margin:0 auto}
.top{position:relative;margin:0 -18px;padding:max(30px,calc(16px + env(safe-area-inset-top,0px))) 18px 26px;overflow:hidden;background:linear-gradient(165deg,#FFE3D1 0%,#F3E8FF 58%,#E6EDFF 100%);border-radius:0 0 34px 34px}
.top::before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-70px;top:-60px;background:rgba(255,255,255,.55);pointer-events:none}
.top::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;left:-50px;bottom:-60px;background:rgba(255,190,160,.45);pointer-events:none}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--accent);background:rgba(255,255,255,.85);border-radius:999px;padding:6px 12px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--hot);display:block}
h1{position:relative;margin:14px 0 0;font-size:clamp(44px,14vw,60px);line-height:1.02;font-weight:900;letter-spacing:-.06em}
h1 em{font-style:normal;background:linear-gradient(90deg,#5B3FD1 0%,#B23FD1 35%,#FF6A3C 60%,#5B3FD1 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--accent);animation:flow 6s linear infinite}
.lead{position:relative;margin:10px 0 0;font-size:15.5px;color:#4D4558;letter-spacing:-.01em}
.share{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:max(14px,calc(8px + env(safe-area-inset-top,0px)));z-index:5;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.share svg{width:18px;height:18px}
.fan{position:relative;height:196px;margin:18px 0 0}
.fan a{position:absolute;left:50%;top:14px;width:128px;aspect-ratio:1/1;margin-left:-64px;border-radius:24px;overflow:hidden;border:5px solid #fff;background:#fff;box-shadow:0 16px 30px -12px rgba(60,30,90,.38);animation:float 4.2s ease-in-out infinite}
.fan a img{width:100%;height:100%;object-fit:cover;display:block}
.fan a:nth-child(1){--r:-11deg;--x:-92px;--y:16px;z-index:1;animation-delay:-1.4s}
.fan a:nth-child(2){--r:0deg;--x:0px;--y:0px;z-index:3;width:146px;margin-left:-73px;top:6px}
.fan a:nth-child(3){--r:11deg;--x:92px;--y:16px;z-index:2;animation-delay:-2.8s}
.fan a:nth-child(2){animation-delay:0s}
.fan .tag{position:absolute;z-index:4;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-size:12.5px;font-weight:800;padding:6px 14px;border-radius:999px}
@keyframes float{0%,100%{transform:translate(var(--x),var(--y)) rotate(var(--r))}50%{transform:translate(var(--x),calc(var(--y) - 8px)) rotate(calc(var(--r) * .8))}}
@keyframes flow{to{background-position:-220% 0}}
.notice{display:flex;gap:8px;align-items:flex-start;margin:14px 0 0;padding:11px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;line-height:1.55;color:var(--sub)}
.notice .ad{flex:none;font-weight:800;color:var(--hot)}
.notice div span{display:block}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.sec h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.03em}
.sec small{font-size:12.5px;color:var(--sub)}
.feed{display:grid;gap:18px}
.item{border-radius:28px;background:var(--surface);overflow:hidden;box-shadow:0 12px 30px -16px rgba(91,63,209,.3);border:1px solid var(--line);transition:opacity .5s,transform .5s}
.item.rv{opacity:0;transform:translateY(22px)}
.item.in{opacity:1;transform:none}
.shot{position:relative;display:block;aspect-ratio:1/1;background:var(--accent-soft);color:inherit}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.no{position:absolute;left:14px;top:14px;background:rgba(27,22,38,.82);color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;padding:6px 11px;border-radius:999px}
.new{position:absolute;right:14px;top:14px;background:var(--hot);color:#fff;font-size:12px;font-weight:800;letter-spacing:.06em;padding:6px 11px;border-radius:999px}
.info{padding:16px 18px 18px}
.info h3{margin:0;font-size:20px;line-height:1.28;font-weight:800;letter-spacing:-.035em}
.info p{margin:6px 0 0;font-size:14.5px;color:var(--sub)}
.cta{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;background:var(--ink);color:#fff;font-size:16px;font-weight:800;letter-spacing:-.02em;text-decoration:none}
a.cta:active{transform:scale(.985)}
.item.off{opacity:.6}
.item.off .cta{background:#E9E3EE;color:#8B8494}
.next{margin-top:18px;display:flex;gap:12px;align-items:center;padding:16px;border-radius:20px;border:1.5px dashed #DCCFC3;color:var(--sub);font-size:14px;background:rgba(255,255,255,.5)}
.next b{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;background:#D9F3E6;font-size:18px}
footer{margin-top:26px;font-size:12px;line-height:1.6;color:var(--sub);text-align:center}
.toast{position:fixed;left:50%;bottom:max(24px,calc(16px + env(safe-area-inset-bottom,0px)));transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:999px;transition:.25s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.item.rv{opacity:1;transform:none}.fan a{transform:translate(var(--x),var(--y)) rotate(var(--r))}}

/* A 네오브루탈 팝 */
:root{--bg:#FFE94D;--ink:#111;--line:#111;--sub:#3a3a3a;--accent:#111;--accent-soft:#fff;--hot:#FF4F9A}
.top{background:#FFE94D;border-radius:0;margin:0 -18px;padding-bottom:22px;border-bottom:3px solid #111}
.top::before{background:#FF8AD0;width:150px;height:150px;border:3px solid #111;right:-40px;top:-50px}
.top::after{background:#7AE0FF;border:3px solid #111;left:-60px;bottom:-70px}
h1{font-size:clamp(46px,15vw,64px);letter-spacing:-.07em;-webkit-text-stroke:0;text-shadow:3px 3px 0 #fff}
h1 em{background:none;-webkit-text-fill-color:#111;color:#111;animation:none;background:#FF4F9A;padding:0 .12em;border:3px solid #111;border-radius:12px;display:inline-block;transform:rotate(-3deg);box-shadow:4px 4px 0 #111;text-shadow:none;margin-left:.05em}
.chip{background:#fff;border:2px solid #111;color:#111;box-shadow:2px 2px 0 #111}
.lead{color:#111;font-weight:600}
.share{background:#fff;border:2px solid #111;box-shadow:2px 2px 0 #111}
.fan a{border:3px solid #111;border-radius:16px;box-shadow:5px 5px 0 #111}
.fan .tag{background:#FF4F9A;color:#111;border:2px solid #111;box-shadow:3px 3px 0 #111}
.notice{background:#fff;border:2px solid #111;border-radius:12px;box-shadow:3px 3px 0 #111;color:#111}
.notice .ad{color:#FF4F9A;-webkit-text-stroke:.3px #111}
.sec h2{font-size:22px;letter-spacing:-.04em}
.item{border:3px solid #111;border-radius:20px;box-shadow:6px 6px 0 #111;background:#fff}
.shot{border-bottom:3px solid #111}
.no{background:#111;border-radius:8px}
.new{background:#FF4F9A;color:#111;border:2px solid #111;border-radius:8px}
.cta{background:#7AE0FF;color:#111;border:3px solid #111;border-radius:14px;box-shadow:4px 4px 0 #111}
.next{background:#fff;border:2px dashed #111;color:#111}

</style>
</head>
<body>
<div class="wrap">
<section class="top">
<button class="share" id="share" type="button" aria-label="이 페이지 링크 공유"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg></button>
<span class="chip"><i></i>쉬고싶은청년 @rest4.life</span>
<h1>LAZY<em>PICK</em></h1>
<p class="lead">최고의 가성비 제품을 공유드립니다 ~ ㅎㅎ</p>
<div class="fan" id="fan"></div>
</section>
<div class="notice" role="note" id="notice"></div>
<div class="sec"><h2>오늘의 딜</h2><small id="count"></small></div>
<div class="feed" id="feed"></div>
<div class="next"><b aria-hidden="true">🛋️</b><span>다음 딜은 글에서 먼저 알려드릴게요.<br>번호는 글이 올라온 순서예요.</span></div>
<footer>품절·종료된 딜은 지우지 않고 아래로 내려요.</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const PRODUCTS = [{"no":"001","name":"세타필 모이스춰라이징 크림","full":"세타필 모이스춰라이징 크림, 550g, 1개","tag":"건조해지는 요즘, 이거 하나면 끝","store":"쿠팡","link":"https://link.coupang.com/a/iiji50PbgW","img":"https://thumbnail15.coupangcdn.com/thumbnails/remote/492x492ex/image/retail/images/107773577349111-724cc438-f29e-4636-9a1c-0a4b7bcb57b6.jpg","soldout":false},{"no":"002","name":"하루온 군인핫팩 포켓용 160g","full":"하루온 군인핫팩 포켓용 대용량 핫팩 160g, 30개","tag":"겨울 오기 전에 미리 챙겨두기","store":"쿠팡","link":"https://link.coupang.com/a/ijKibz9pnw","img":"https://thumbnail13.coupangcdn.com/thumbnails/remote/492x492ex/image/retail/images/2026/08/14/16/1/11855595-36a1-4c44-9493-a22589e78c57.jpg","soldout":false},{"no":"003","name":"꼬깔콘 쌈장 삼겹살맛 134g, 2개","full":"꼬깔콘 쌈장 삼겹살맛, 134g, 2개","tag":"과자가 쌈장 맛으로 나옴","store":"쿠팡","link":"https://link.coupang.com/a/ikl3ltVgrY","img":"https://thumbnail.coupangcdn.com/thumbnails/remote/492x492ex/image/retail/images/431de360-d2d8-48df-aee3-3e96d0370e0e16999259528269128538.png","soldout":false},{"no":"004","name":"홈스타 바르는 곰팡이 싹 세정제 120ml","full":"홈스타 바르는 곰팡이 싹 세정제, 120ml, 1개","tag":"욕실 실리콘 곰팡이, 바르는 젤로 간단하게","store":"쿠팡","link":"https://link.coupang.com/a/ilR9gCERoG","img":"https://thumbnail9.coupangcdn.com/thumbnails/remote/492x492ex/image/retail/images/342188912460101-548780de-e2d6-48fd-9d7c-d32a45c61d8b.jpg","soldout":false},{"no":"005","name":"가든클래식스 고구마공장 아이스 군고구마 1kg","full":"가든클래식스 고구마공장 아이스 군고구마 (냉동), 1kg, 1개","tag":"편의점 군고구마 대신, 냉동으로 쟁여두고","store":"쿠팡","link":"https://link.coupang.com/a/ivSZUlYppc","img":"https://thumbnail.coupangcdn.com/thumbnails/remote/640x640ex/image/retail/images/5223362065285807-be576f3f-0092-46cf-b818-c8d37ef74dc2.jpg","soldout":false},{"no":"006","name":"백설 찹쌀 호떡믹스 400g 2개","full":"백설 찹쌀 호떡믹스, 400g, 2개","tag":"겨울 길거리 호떡, 집에서 간단하게","store":"쿠팡","link":"https://link.coupang.com/a/iwUFDYhyJE","img":"https://thumbnail.coupangcdn.com/thumbnails/remote/640x640ex/image/retail/images/481afd58-e852-452e-bf6a-6872c1b4bddc8057746059000714559.png","soldout":false}];
const DISCLOSE = {
"쿠팡": "[광고] 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.",
"토스쇼핑": "[광고] 토스쇼핑 쉐어링크 활동으로, 링크 구매 시 수수료를 지급받습니다."
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const big = u => String(u).replace(/\/(\d+)x\1ex\//, "/800x800ex/");
const shown = PRODUCTS.filter(p => !p.hidden).sort((a,b)=>(a.soldout-b.soldout)||b.no.localeCompare(a.no));
$("notice").innerHTML = '<span class="ad">[광고]</span><div>' + Array.from(new Set(shown.map(p => p.store))).map(s => DISCLOSE[s]).filter(Boolean).map(x => "<span>" + x.replace(/^\[광고\]\s*/, "") + "</span>").join("") + '</div>';
$("count").textContent = shown.length ? shown.length + "개" : "";
var live = shown.filter(p => !p.soldout);
var fan = live.slice(0,3);
if (fan.length === 3){ fan = [fan[1], fan[0], fan[2]]; }
fan.forEach(function(p){ var a = document.createElement("a"); a.href = "#p" + p.no; a.setAttribute("aria-label", "NO." + p.no + " " + p.name); a.innerHTML = '<img src="' + esc(big(p.img)) + '" alt="" width="200" height="200" referrerpolicy="no-referrer">'; $("fan").appendChild(a); });
if (fan.length){ var t = document.createElement("span"); t.className = "tag"; t.textContent = "NEW · 오늘의 딜 " + live.length + "개"; $("fan").appendChild(t); }
var newNo = live.length ? live[0].no : "";
shown.forEach(function(p, i){
var ready = p.link && !p.soldout;
var art = document.createElement("article"); art.className = "item" + (ready ? "" : " off"); art.id = "p" + p.no;
var shot = document.createElement(ready ? "a" : "div"); shot.className = "shot";
var cta = document.createElement(ready ? "a" : "div"); cta.className = "cta"; cta.textContent = ready ? p.store + "에서 보기 →" : "품절";
[shot, cta].forEach(function(el){ if (ready){ el.href = p.link; el.target = "_blank"; el.rel = "sponsored noopener"; } });
if (ready){ shot.setAttribute("aria-label", p.no + " " + p.name + " " + p.store + "에서 보기"); }
shot.innerHTML = '<img src="' + esc(big(p.img)) + '" alt="" width="800" height="800"' + (i > 1 ? ' loading="lazy"' : '') + ' referrerpolicy="no-referrer"><span class="no">NO.' + esc(p.no) + (p.soldout ? " · 품절" : "") + '</span>' + (p.no === newNo ? '<span class="new">NEW</span>' : "");
var info = document.createElement("div"); info.className = "info"; info.innerHTML = '<h3>' + esc(p.name) + '</h3><p>' + esc(p.tag || "") + '</p>'; info.appendChild(cta);
art.appendChild(shot); art.appendChild(info); $("feed").appendChild(art);
});
if ("IntersectionObserver" in window){
var items = document.querySelectorAll(".item");
var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("in"); e.target.classList.remove("rv"); io.unobserve(e.target); } }); }, {rootMargin:"0px 0px -8% 0px"});
items.forEach(function(el, i){ if (i > 0){ el.classList.add("rv"); io.observe(el); } });
}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},1800)}
$("share").addEventListener("click", function(){
var url = location.href.split("#")[0];
if (navigator.share){ navigator.share({title:"LAZY PICK", url:url}).catch(function(){}); return; }
try{ navigator.clipboard.writeText(url).then(function(){toast("링크를 복사했어요")},function(){toast(url)}) }catch(e){ toast(url) }
});
</script>
</body>
</html>

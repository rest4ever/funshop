<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재밌는 쇼핑 · 쉬고싶은청년</title>
<meta name="theme-color" content="#FFF4EC">
<meta name="description" content="최고의 가성비 제품을 공유드립니다. 이 페이지의 링크는 제휴 링크입니다.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
--bg:#FFF8F2; --surface:#FFFFFF; --ink:#1B1626; --sub:#6F6877; --line:#EFE4DB;
--accent:#5B3FD1; --accent-soft:#EEE9FF; --peach:#FFE3D1; --butter:#FFF0B8; --mint:#D9F3E6;
--hot:#FF5A3C; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:manipulation;
font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased;
padding:0 max(18px,env(safe-area-inset-right,0px)) max(48px,calc(24px + env(safe-area-inset-bottom,0px))) max(18px,env(safe-area-inset-left,0px))}
.wrap{max-width:520px;margin:0 auto}
.top{position:relative;margin:0 -18px;padding:max(34px,calc(18px + env(safe-area-inset-top,0px))) 18px 30px;overflow:hidden;
background:linear-gradient(160deg,#FFE9DA 0%,#F3E8FF 62%,#EAF0FF 100%);border-radius:0 0 32px 32px}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.top::before{width:170px;height:170px;right:-50px;top:-46px;background:rgba(255,255,255,.55)}
.top::after{width:90px;height:90px;right:30px;bottom:-62px;background:rgba(255,200,170,.5)}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--accent);
background:rgba(255,255,255,.8);border-radius:999px;padding:6px 12px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--hot);display:block}
h1{position:relative;margin:16px 0 0;font-size:clamp(38px,12vw,50px);line-height:1.06;font-weight:900;letter-spacing:-.055em}
h1 em{font-style:normal;color:var(--accent)}
.lead{position:relative;margin:12px 0 0;font-size:15.5px;color:#4D4558;letter-spacing:-.01em}
.notice{margin:16px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
font-size:12.5px;line-height:1.55;color:var(--sub)}
.notice span{display:block}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 12px}
.sec h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.03em}
.sec small{font-size:12.5px;color:var(--sub)}
.hero{display:block;position:relative;border-radius:26px;overflow:hidden;background:var(--butter);color:inherit;text-decoration:none;
box-shadow:0 10px 28px -12px rgba(91,63,209,.28)}
a.hero:active{transform:scale(.99)}
.hero .stage{position:relative;aspect-ratio:16/10;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#fff 0 34%,rgba(255,255,255,0) 70%),linear-gradient(135deg,#FFE9A8,#FFD3B8)}
.hero .stage img{width:42%;margin-top:18px;height:auto;aspect-ratio:1/1;object-fit:cover;border-radius:24px;box-shadow:0 14px 30px -10px rgba(60,30,0,.35);border:5px solid #fff;transform:rotate(-3deg)}
.hero .body{padding:18px 20px 20px;background:var(--surface)}
.hero .no{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--accent)}
.hero .name{margin:4px 0 0;font-size:21px;line-height:1.25;font-weight:800;letter-spacing:-.035em}
.hero .tag{margin:6px 0 0;font-size:15px;color:var(--sub)}
.cta{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;
background:var(--ink);color:#fff;font-size:16px;font-weight:800;letter-spacing:-.02em}
.cta.off{background:#E9E3EE;color:#8B8494}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:block;border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:10px 10px 14px;color:inherit;text-decoration:none}
.card .ph{aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--accent-soft)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .no{margin-top:10px;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--accent)}
.card .name{margin:2px 0 0;font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-.025em}
.next{margin-top:12px;display:flex;gap:12px;align-items:center;padding:16px;border-radius:20px;border:1.5px dashed #DCCFC3;color:var(--sub);font-size:14px;background:rgba(255,255,255,.5)}
.next b{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;background:var(--mint);font-size:18px}
footer{margin-top:26px;font-size:12px;line-height:1.6;color:var(--sub);text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
h1{isolation:isolate}
.ttl{position:relative;display:inline-block;white-space:nowrap}
.lie{position:relative;display:inline-block}
.lie::after{content:"";position:absolute;left:-3px;right:-3px;bottom:.04em;height:.3em;border-radius:999px;z-index:-1;
background:linear-gradient(90deg,#FFC9A8,#FFB7C9);transform:scaleX(0);transform-origin:left center;animation:draw .9s .25s cubic-bezier(.2,.8,.2,1) forwards}
h1 em{background:linear-gradient(90deg,#5B3FD1 0%,#B23FD1 35%,#FF6A3C 60%,#5B3FD1 100%);background-size:220% 100%;
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--accent);animation:flow 6s linear infinite}
.spark{position:absolute;pointer-events:none;color:#fff;filter:drop-shadow(0 2px 6px rgba(91,63,209,.25));animation:twinkle 2.8s ease-in-out infinite}
.spark.a{width:20px;right:150px;top:26px}
.spark.b{width:14px;right:42px;top:88px;animation-delay:1.1s;color:#FFC9A8}
.spark.c{width:12px;right:22px;bottom:30px;animation-delay:1.9s}
@keyframes draw{to{transform:scaleX(1)}}
@keyframes flow{to{background-position:-220% 0}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.lie::after{transform:scaleX(1);animation:none}h1 em{animation:none}}
.cart{position:absolute;right:14px;top:54px;width:clamp(112px,36vw,150px);height:auto;pointer-events:none;overflow:visible;filter:drop-shadow(0 8px 10px rgba(91,63,209,.18))}
.rock{transform-box:fill-box;transform-origin:50% 100%;animation:rock 2.2s ease-in-out infinite}
.wh{transform-box:fill-box;transform-origin:center;animation:spin 1.6s linear infinite}
.it{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:drop 4.8s cubic-bezier(.3,.9,.3,1) infinite}
.i2{animation-delay:.7s}.i3{animation-delay:1.4s}
@keyframes rock{0%,100%{transform:translateX(-3px) rotate(-2deg)}50%{transform:translateX(3px) rotate(2deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drop{0%{opacity:0;transform:translateY(-38px) rotate(-14deg)}10%{opacity:1;transform:translateY(5px) rotate(3deg)}15%{transform:translateY(0) rotate(0)}78%{opacity:1;transform:translateY(0)}92%,100%{opacity:0;transform:translateY(0)}}
.bob{animation:bob .7s ease-in-out infinite}.leg{transform-box:fill-box;transform-origin:50% 0;animation:step .7s ease-in-out infinite}.leg.b{animation-delay:-.35s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes step{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}
@media (prefers-reduced-motion:reduce){.rock,.wh,.bob,.leg{animation:none}.it{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="wrap">
<section class="top">
<span class="chip"><i></i>쉬고싶은청년 @rest4.life</span>
<h1><span class="ttl"><span class="lie">재밌는</span> <em>쇼핑</em></span></h1>
<svg class="spark a" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.8 6.3 5.7 11.2 12 12-6.3.8-11.2 5.7-12 12-.8-6.3-5.7-11.2-12-12C6.3 11.2 11.2 6.3 12 0z"/></svg><svg class="spark b" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.8 6.3 5.7 11.2 12 12-6.3.8-11.2 5.7-12 12-.8-6.3-5.7-11.2-12-12C6.3 11.2 11.2 6.3 12 0z"/></svg><svg class="spark c" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.8 6.3 5.7 11.2 12 12-6.3.8-11.2 5.7-12 12-.8-6.3-5.7-11.2-12-12C6.3 11.2 11.2 6.3 12 0z"/></svg>
<svg class="cart" viewBox="0 0 190 110" aria-hidden="true">
<ellipse cx="100" cy="101" rx="84" ry="4" fill="rgba(91,63,209,.12)"/>
<g transform="translate(88,35.4) scale(.68)">
<g class="rock">
<path d="M6 14h14l8 14" fill="none" stroke="#1B1626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M26 28h82l-9 38H36z" fill="#FFF4EC" stroke="#1B1626" stroke-width="4" stroke-linejoin="round"/>
<g class="it i1"><rect x="44" y="6" width="18" height="30" rx="6" fill="#7FD6A8" stroke="#1B1626" stroke-width="3"/><rect x="47" y="1" width="12" height="7" rx="3" fill="#5B3FD1" stroke="#1B1626" stroke-width="3"/></g>
<g class="it i2"><rect x="67" y="14" width="24" height="22" rx="5" fill="#FF9F7A" stroke="#1B1626" stroke-width="3"/><path d="M79 14v22" stroke="#1B1626" stroke-width="3"/></g>
<g class="it i3"><path d="M96 20c-3-6-12-3-9 4 2 4 9 8 9 8s7-4 9-8c3-7-6-10-9-4z" fill="#FFD84D" stroke="#1B1626" stroke-width="3" stroke-linejoin="round"/></g>
<path d="M31 40h74l-6 26H36z" fill="#fff" stroke="#1B1626" stroke-width="4" stroke-linejoin="round"/>
<path d="M52 46v14M68 46v14M84 46v14" stroke="#E3D6F7" stroke-width="3" stroke-linecap="round"/>
<path d="M38 70h56" stroke="#1B1626" stroke-width="4" stroke-linecap="round"/>
<g class="wh"><circle cx="46" cy="82" r="8" fill="#5B3FD1" stroke="#1B1626" stroke-width="3.5"/><path d="M46 77v10M41 82h10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>
<g class="wh"><circle cx="88" cy="82" r="8" fill="#5B3FD1" stroke="#1B1626" stroke-width="3.5"/><path d="M88 77v10M83 82h10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>
</g>
</g>
<g class="bob">
<g transform="translate(40 98) scale(1.15) translate(-40 -98)">
<g class="leg a"><rect x="31" y="78" width="7" height="17" rx="3.5" fill="#3A2E55" stroke="#1B1626" stroke-width="3"/><rect x="29" y="92" width="12" height="6" rx="3" fill="#fff" stroke="#1B1626" stroke-width="3"/></g>
<g class="leg b"><rect x="44" y="78" width="7" height="17" rx="3.5" fill="#3A2E55" stroke="#1B1626" stroke-width="3"/><rect x="42" y="92" width="12" height="6" rx="3" fill="#fff" stroke="#1B1626" stroke-width="3"/></g>
<rect x="24" y="50" width="32" height="32" rx="12" fill="#5B3FD1" stroke="#1B1626" stroke-width="3.5"/>
<path d="M33 70h14" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
<circle cx="40" cy="33" r="16" fill="#FFD9B8" stroke="#1B1626" stroke-width="3.5"/>
<path d="M24 31a16 16 0 0 1 32 0c-4-6-10-8-16-8s-12 2-16 8z" fill="#3A2E55" stroke="#1B1626" stroke-width="3" stroke-linejoin="round"/>
<path d="M38 17q2-7 8-6" fill="none" stroke="#1B1626" stroke-width="3" stroke-linecap="round"/>
<circle cx="34" cy="37" r="2.2" fill="#1B1626"/><circle cx="47" cy="37" r="2.2" fill="#1B1626"/>
<ellipse cx="30" cy="42" rx="3.2" ry="2" fill="#FF9FB0"/><ellipse cx="51" cy="42" rx="3.2" ry="2" fill="#FF9FB0"/>
<path d="M37 42q3.5 3.5 7 0" fill="none" stroke="#1B1626" stroke-width="2.4" stroke-linecap="round"/>
</g>
<path d="M57 62Q80 64 100 47" fill="none" stroke="#1B1626" stroke-width="8" stroke-linecap="round"/>
<path d="M57 62Q80 64 100 47" fill="none" stroke="#4A32B0" stroke-width="3.6" stroke-linecap="round"/>
<circle cx="100" cy="46" r="4.2" fill="#FFD9B8" stroke="#1B1626" stroke-width="2.4"/>
<path d="M58 56Q76 58 93 46" fill="none" stroke="#1B1626" stroke-width="8" stroke-linecap="round"/>
<path d="M58 56Q76 58 93 46" fill="none" stroke="#5B3FD1" stroke-width="3.6" stroke-linecap="round"/>
<circle cx="93" cy="45" r="4.2" fill="#FFD9B8" stroke="#1B1626" stroke-width="2.4"/>
</g>
</svg>
<p class="lead">최고의 가성비 제품을 공유드립니다 ~ ㅎㅎ</p>
</section>
<div class="notice" role="note" id="notice"></div>
<div class="sec"><h2>오늘의 딜</h2><small id="count"></small></div>
<div id="hero"></div>
<div class="sec" id="moreHead" hidden><h2>지난 추천</h2></div>
<ul class="grid" id="grid"></ul>
<div class="next"><b aria-hidden="true">🛋️</b><span>다음 딜은 글에서 먼저 알려드릴게요.<br>번호는 글이 올라온 순서예요.</span></div>
<footer>품절·종료된 딜은 지우지 않고 아래로 내려요.</footer>
</div>
<script>
const PRODUCTS = [{"no": "001", "name": "세타필 모이스춰라이징 크림", "full": "세타필 모이스춰라이징 크림, 550g, 1개", "tag": "건조해지는 요즘, 이거 하나면 끝", "store": "쿠팡", "link": "https://link.coupang.com/a/iiji50PbgW", "img": "https://thumbnail15.coupangcdn.com/thumbnails/remote/492x492ex/image/retail/images/107773577349111-724cc438-f29e-4636-9a1c-0a4b7bcb57b6.jpg", "soldout": false}, {"no": "002", "name": "하루온 군인핫팩 포켓용 160g", "full": "하루온 군인핫팩 포켓용 대용량 핫팩 160g, 30개", "tag": "겨울 오기 전에 미리 챙겨두기", "store": "쿠팡", "link": "https://link.coupang.com/a/ijKibz9pnw", "img": "https://thumbnail13.coupangcdn.com/thumbnails/remote/492x492ex/image/retail/images/2026/08/14/16/1/11855595-36a1-4c44-9493-a22589e78c57.jpg", "soldout": false}];
const DISCLOSE = {
"쿠팡": "[광고] 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.",
"토스쇼핑": "[광고] 토스쇼핑 쉐어링크 활동으로, 링크 구매 시 수수료를 지급받습니다."
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shown = PRODUCTS.filter(p => !p.hidden).sort((a,b)=>(a.soldout-b.soldout)||b.no.localeCompare(a.no));
$("notice").innerHTML = Array.from(new Set(shown.map(p => p.store))).map(s => DISCLOSE[s]).filter(Boolean).map(x => "<span>" + x + "</span>").join("");
$("count").textContent = shown.length ? shown.length + "개" : "";
const live = shown.filter(p => !p.soldout);
const hero = live[0], rest = shown.filter(p => p !== hero);
function link(p, cls, inner){
var ready = p.link && !p.soldout;
var el = document.createElement(ready ? "a" : "div"); el.className = cls; el.innerHTML = inner;
if (ready){ el.href = p.link; el.target = "_blank"; el.rel = "sponsored noopener"; el.setAttribute("aria-label", p.no + " " + p.name + " " + p.store + "에서 보기"); }
return el;
}
if (hero){
var cta = hero.link ? '<div class="cta">' + esc(hero.store) + '에서 보기 <span aria-hidden="true">↗</span></div>' : '<div class="cta off">' + esc(hero.opens ? hero.opens + " 공개" : "공개 예정") + '</div>';
$("hero").appendChild(link(hero, "hero", '<div class="stage"><img src="' + esc(hero.img) + '" alt="" width="360" height="360" referrerpolicy="no-referrer"></div><div class="body"><div class="no">NO.' + esc(hero.no) + '</div><p class="name">' + esc(hero.name) + '</p><p class="tag">' + esc(hero.tag) + '</p>' + cta + '</div>'));
}
$("moreHead").hidden = rest.length === 0;
rest.forEach(function(p){
var li = document.createElement("li");
li.appendChild(link(p, "card", '<div class="ph"><img src="' + esc(p.img) + '" alt="" width="360" height="360" loading="lazy" referrerpolicy="no-referrer"></div><div class="no">NO.' + esc(p.no) + (p.soldout ? " · 품절" : "") + '</div><p class="name">' + esc(p.name) + '</p>'));
$("grid").appendChild(li);
});
</script>
</body>
</html>
